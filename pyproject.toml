[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "useful-notebooks-cube"
version = "0.1.0"
description = "Reusable cube-file analysis tools for useful-notebooks"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "ipywidgets",
]

[tool.setuptools]
packages = ["useful_notebooks_cube", "useful_notebooks_cp2k_unfolding"]

[project.scripts]
cp2k-overlap-to-sparse-npz = "useful_notebooks_cp2k_unfolding.overlap_cli:main"
cp2k-unfold-wfn-sparse = "useful_notebooks_cp2k_unfolding.unfold_cli:main"
